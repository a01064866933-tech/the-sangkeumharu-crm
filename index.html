<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>더상큼하루 | 문의·주문 CRM</title>
<style>
:root{--green:#2f8d63;--deep:#244637;--mint:#e8f7ee;--cream:#fffaf1;--orange:#e7834b;--ink:#24322c;--muted:#748078;--line:#e5ebe6;--bg:#f5f8f5;--danger:#b64035;--shadow:0 12px 32px rgba(54,82,65,.09)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(430px,100%);padding:32px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);text-align:center}.eyebrow{color:var(--green);font-size:11px;font-weight:900;letter-spacing:.1em}.login-card h1{margin:10px 0 8px;font-size:26px}.muted{color:var(--muted)}.login-card input{width:100%;margin:18px 0 10px;padding:14px;border:1px solid var(--line);border-radius:12px}.primary{border:0;border-radius:12px;background:var(--green);color:#fff;padding:13px 17px;font-weight:800}.login-card .primary{width:100%}.message{min-height:22px;margin:10px 0 0;color:var(--orange);font-size:12px}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:230px;padding:26px 17px;background:#fff;border-right:1px solid var(--line)}.brand{padding:0 10px 24px}.brand strong{display:block;font-size:20px}.brand span{color:var(--green);font-size:11px;font-weight:800}.nav{display:grid;gap:6px}.nav button,.logout{width:100%;border:0;border-radius:11px;background:transparent;padding:12px;text-align:left;color:var(--muted);font-weight:700}.nav button.active{background:var(--mint);color:var(--green)}.logout{position:absolute;left:17px;right:17px;bottom:24px;width:calc(100% - 34px)}main{margin-left:230px;padding:32px 38px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center}.top h1{margin:5px 0 0;font-size:28px}.top-actions{display:flex;gap:9px}.secondary{border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--green);padding:12px 15px;font-weight:800;text-decoration:none}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:25px 0}.metric{padding:18px;background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.metric small{color:var(--muted);font-weight:700}.metric strong{display:block;margin-top:7px;font-size:28px}.panel{padding:22px;background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}.panel-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:16px}.panel h2{margin:0;font-size:18px}.filters{display:flex;gap:8px}.filters input,.filters select,.modal input,.modal select,.modal textarea{border:1px solid var(--line);border-radius:10px;background:#f8faf8;padding:10px 11px}.filters input{min-width:250px}.lead-list{display:grid}.lead{display:grid;grid-template-columns:1.1fr .9fr .8fr .8fr auto;gap:12px;align-items:center;padding:15px 6px;border-bottom:1px solid var(--line)}.lead:last-child{border:0}.lead button{border:0;background:transparent;text-align:left;color:inherit}.lead strong{display:block}.lead small{display:block;margin-top:3px;color:var(--muted)}.badge{display:inline-flex;width:max-content;padding:5px 9px;border-radius:999px;background:#edf2ee;color:#5e6c64;font-size:11px;font-weight:800}.badge.group_order{background:#e8f3ff;color:#3978a9}.badge.class{background:#fff0e5;color:#b76836}.stage{font-size:12px;font-weight:800;color:var(--green)}.empty{padding:38px;text-align:center;color:var(--muted)}.modal-back{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(22,51,40,.48)}.modal-back.show{display:flex}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;padding:25px;background:#fff;border-radius:21px;box-shadow:0 28px 80px rgba(20,40,30,.25)}.modal-head{display:flex;justify-content:space-between;align-items:start;gap:12px}.modal h2{margin:0}.close{border:0;background:#edf2ee;border-radius:9px;padding:8px 11px}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.detail{padding:13px;border-radius:12px;background:#f7f9f7}.detail.full{grid-column:1/-1}.detail small{display:block;color:var(--muted);font-size:11px}.detail strong{display:block;margin-top:4px;white-space:pre-wrap}.modal-actions{display:flex;flex-wrap:wrap;gap:8px}.modal-actions a,.modal-actions button{border:0;border-radius:10px;padding:11px 13px;background:var(--green);color:#fff;text-decoration:none;font-weight:800}.modal-actions .secondary{background:#fff;color:var(--green);border:1px solid var(--green)}.template-list{display:grid;gap:10px;margin-top:18px}.template{padding:14px;border:1px solid var(--line);border-radius:13px}.template strong{font-size:13px}.template p{margin:6px 0;color:var(--muted);font-size:12px;line-height:1.6}.template button{border:0;border-radius:9px;background:var(--mint);color:var(--green);padding:8px 10px;font-weight:800}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800}.field input,.field select,.field textarea{width:100%}.error{color:var(--danger);font-size:12px}.toast{position:fixed;right:20px;bottom:20px;z-index:30;padding:12px 16px;border-radius:12px;background:var(--deep);color:#fff;box-shadow:var(--shadow)}@media(max-width:850px){.sidebar{position:static;width:100%;padding:13px}.brand{padding:4px 7px 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.logout{position:static;width:auto;margin-top:5px}main{margin:0;padding:18px}.top{align-items:flex-start}.top h1{font-size:23px}.metrics{grid-template-columns:1fr 1fr;gap:8px}.filters{width:100%;flex-wrap:wrap}.filters input{min-width:0;flex:1}.panel{padding:15px}.lead{grid-template-columns:1fr .8fr auto}.lead .company,.lead .date{display:none}.details,.form-grid{grid-template-columns:1fr}.detail.full,.field.full{grid-column:auto}}
</style></head><body>
<section id="loginScreen" class="login"><div class="login-card"><div class="eyebrow">THE SSANGKEUMHARU</div><h1>사장님 전용 CRM</h1><p class="muted">허용된 이메일로 로그인 링크를 받아 안전하게 접속합니다.</p><input id="loginEmail" type="email" autocomplete="email" placeholder="이메일 주소"><button id="loginButton" class="primary">로그인 링크 받기</button><p id="loginMessage" class="message"></p></div></section>
<div id="app" class="app hidden"><aside class="sidebar"><div class="brand"><strong>더상큼하루</strong><span>문의·주문 CRM</span></div><nav class="nav"><button class="active" data-filter="all">전체 문의</button><button data-filter="group_order">단체주문</button><button data-filter="class">클래스</button></nav><button id="logoutButton" class="logout">로그아웃</button></aside><main><header class="top"><div><div class="eyebrow">TODAY'S WORKSPACE</div><h1>오늘 처리할 문의</h1></div><div class="top-actions"><a class="secondary" href="https://center-pf.kakao.com/" target="_blank" rel="noopener noreferrer">카카오 관리자</a><button id="refreshButton" class="primary">새로고침</button></div></header><section class="metrics"><div class="metric"><small>전체 문의</small><strong id="metricTotal">0</strong></div><div class="metric"><small>신규·답변 대기</small><strong id="metricWaiting">0</strong></div><div class="metric"><small>결제 완료</small><strong id="metricPaid">0</strong></div><div class="metric"><small>다가오는 일정</small><strong id="metricUpcoming">0</strong></div></section><section class="panel"><div class="panel-head"><div><h2>문의 목록</h2><span class="muted" id="lastUpdated"></span></div><div class="filters"><input id="searchInput" placeholder="이름·연락처·문의번호 검색"><select id="statusFilter"><option value="all">전체 단계</option></select></div></div><div id="leadList" class="lead-list"></div></section></main></div>
<div id="detailBack" class="modal-back" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="modal"><div class="modal-head"><div><div class="eyebrow" id="detailType"></div><h2 id="detailTitle">문의 상세</h2></div><button class="close" data-close="detailBack">닫기</button></div><div id="detailContent" class="details"></div><div class="modal-actions"><a id="callLink" href="#">전화하기</a><a class="secondary" href="https://center-pf.kakao.com/" target="_blank" rel="noopener noreferrer">카카오 열기</a><select id="detailStatus"></select><button id="saveStatus">단계 저장</button></div><div class="template-list" id="templateList"></div></div></div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
(()=>{const cfg=window.FRESH_DAY_CONFIG;if(!cfg||!window.supabase){document.body.textContent='CRM 설정을 확인해 주세요.';return}const db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const $=id=>document.getElementById(id);let leads=[],templates=[],typeFilter='all',selected=null;const statusMap={group_order:['신규 견적','제작 가능 확인','견적 발송','고객 확정','결제 대기','결제 완료','재료 발주','제작 예정','배송 완료','후기 요청','취소'],class:['신규 신청','상담 필요','일정 확인','일정 확정','결제 대기','결제 완료','수업 예정','수업 완료','후기 요청','취소'],writer:['신규 문의','답변 완료','협의 중','확정','완료','취소']};
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}function fmtMoney(v){return v==null?'-':new Intl.NumberFormat('ko-KR').format(v)+'원'}function labelType(t){return t==='group_order'?'단체주문':t==='class'?'클래스':'작가 문의'}function text(v){return v==null||v===''?'-':String(v)}
function el(tag,cls,content){const n=document.createElement(tag);if(cls)n.className=cls;if(content!=null)n.textContent=content;return n}function detail(label,value,full=false){const box=el('div','detail'+(full?' full':''));box.append(el('small','',label),el('strong','',text(value)));return box}
async function load(){const [lr,tr]=await Promise.all([db.from('inquiries').select('id,inquiry_code,lead_type,status,contact_name,phone,company,email,event_date,requested_time,fulfillment_method,address,package_type,quantity,menu1,menu1_qty,menu2,menu2_qty,drink_change,excluded_ingredients,receipt_type,estimated_subtotal,notes,created_at,updated_at').order('created_at',{ascending:false}).limit(300),db.from('reply_templates').select('id,lead_type,stage,title,body,sort_order').order('sort_order')]);if(lr.error){toast('문의 목록을 불러오지 못했습니다.');return}leads=lr.data||[];templates=tr.data||[];render();$('lastUpdated').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' 기준'}
function filtered(){const q=$('searchInput').value.trim().toLowerCase(),s=$('statusFilter').value;return leads.filter(x=>(typeFilter==='all'||x.lead_type===typeFilter)&&(s==='all'||x.status===s)&&[x.inquiry_code,x.contact_name,x.phone,x.company].join(' ').toLowerCase().includes(q))}
function render(){const list=$('leadList');list.replaceChildren();const rows=filtered();if(!rows.length){list.append(el('div','empty','조건에 맞는 문의가 없습니다.'))}rows.forEach(x=>{const row=el('div','lead');const who=document.createElement('button');who.append(el('strong','',x.contact_name),el('small','',x.inquiry_code));who.addEventListener('click',()=>openDetail(x));const company=el('div','company');company.append(el('span','badge '+x.lead_type,labelType(x.lead_type)),el('small','',text(x.company)));const date=el('div','date');date.append(el('strong','',text(x.event_date)),el('small','',text(x.requested_time)));row.append(who,company,date,el('span','stage',x.status));const open=document.createElement('button');open.className='secondary';open.textContent='보기';open.addEventListener('click',()=>openDetail(x));row.append(open);list.append(row)});$('metricTotal').textContent=leads.length;$('metricWaiting').textContent=leads.filter(x=>!['결제 완료','재료 발주','제작 예정','배송 완료','수업 예정','수업 완료','후기 요청','완료','취소'].includes(x.status)).length;$('metricPaid').textContent=leads.filter(x=>x.status==='결제 완료').length;const now=new Date().toISOString().slice(0,10);$('metricUpcoming').textContent=leads.filter(x=>x.event_date&&x.event_date>=now&&!['배송 완료','수업 완료','완료','취소'].includes(x.status)).length;refreshStatuses()}
function refreshStatuses(){const current=$('statusFilter').value;const all=[...new Set(leads.filter(x=>typeFilter==='all'||x.lead_type===typeFilter).map(x=>x.status))];$('statusFilter').replaceChildren(new Option('전체 단계','all'),...all.map(s=>new Option(s,s)));$('statusFilter').value=all.includes(current)?current:'all'}
function openDetail(x){selected=x;$('detailType').textContent=labelType(x.lead_type);$('detailTitle').textContent=`${x.contact_name} · ${x.inquiry_code}`;const c=$('detailContent');c.replaceChildren(detail('회사·기관',x.company),detail('연락처',x.phone),detail('수령일',x.event_date),detail('희망시간',x.requested_time),detail('구성',x.package_type),detail('수량',x.quantity?x.quantity+'세트':'-'),detail('메뉴 1',x.menu1?`${x.menu1} ${x.menu1_qty}세트`:'-'),detail('메뉴 2',x.menu2?`${x.menu2} ${x.menu2_qty}세트`:'-'),detail('수령 방법',x.fulfillment_method==='delivery'?'퀵 배송':x.fulfillment_method==='pickup'?'매장 픽업':'-'),detail('예상 상품금액',fmtMoney(x.estimated_subtotal)),detail('주소',x.address,true),detail('음료 변경',x.drink_change,true),detail('제외 재료',x.excluded_ingredients,true),detail('추가 요청',x.notes,true));$('callLink').href='tel:'+x.phone.replace(/[^0-9+]/g,'');const statuses=statusMap[x.lead_type]||statusMap.writer;$('detailStatus').replaceChildren(...statuses.map(s=>new Option(s,s)));$('detailStatus').value=x.status;renderTemplates(x);$('detailBack').classList.add('show')}
function renderTemplates(x){const box=$('templateList');box.replaceChildren();templates.filter(t=>t.lead_type===x.lead_type).forEach(t=>{const card=el('div','template');card.append(el('strong','',t.title),el('p','',t.body));const b=el('button','', '답변 복사');b.addEventListener('click',async()=>{let body=t.body.replaceAll('{{estimated_subtotal}}',fmtMoney(x.estimated_subtotal)).replaceAll('{{contact_name}}',x.contact_name).replaceAll('{{class_date}}',text(x.event_date));await navigator.clipboard.writeText(body);toast('답변을 복사했습니다.')});card.append(b);box.append(card)})}
$('loginButton').addEventListener('click',async()=>{const email=$('loginEmail').value.trim();if(!email){$('loginMessage').textContent='이메일을 입력해 주세요.';return}$('loginButton').disabled=true;const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});$('loginButton').disabled=false;$('loginMessage').textContent=error?'로그인 링크 전송에 실패했습니다.':'이메일로 로그인 링크를 보냈습니다.'});$('logoutButton').addEventListener('click',async()=>{await db.auth.signOut();location.reload()});$('refreshButton').addEventListener('click',load);$('searchInput').addEventListener('input',render);$('statusFilter').addEventListener('change',render);document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');typeFilter=b.dataset.filter;render()}));document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$(b.dataset.close).classList.remove('show')));$('detailBack').addEventListener('click',e=>{if(e.target===$('detailBack'))$('detailBack').classList.remove('show')});$('saveStatus').addEventListener('click',async()=>{if(!selected)return;const status=$('detailStatus').value;const {error}=await db.from('inquiries').update({status}).eq('id',selected.id);if(error){toast('단계 저장에 실패했습니다.');return}selected.status=status;const row=leads.find(x=>x.id===selected.id);if(row)row.status=status;render();toast('상담 단계를 저장했습니다.')});
async function start(){const {data}=await db.auth.getSession();if(!data.session){$('loginScreen').classList.remove('hidden');$('app').classList.add('hidden');return}$('loginScreen').classList.add('hidden');$('app').classList.remove('hidden');await load()}db.auth.onAuthStateChange(()=>setTimeout(start,0));start();})();
</script></body></html>
