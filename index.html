<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>더상큼하루 | 창업 클래스 CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#24322c;--muted:#7a8980;--line:#e8eee9;--green:#2f8d63;--mint:#e8f7ee;--cream:#fffaf1;--orange:#f29b65;--shadow:0 14px 35px rgba(54,82,65,.08)}
    *{box-sizing:border-box}body{margin:0;background:#f6f8f6;color:var(--ink);font-family:'Noto Sans KR',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
    .app{display:flex;min-height:100vh}.side{width:245px;background:#fff;border-right:1px solid var(--line);padding:28px 18px;position:fixed;inset:0 auto 0 0}.brand{padding:0 12px 32px}.brand strong{display:block;font-size:20px;letter-spacing:-.04em}.brand span{color:var(--green);font-size:12px;font-weight:700}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#718078;text-align:left;border-radius:12px;padding:13px 14px;font-weight:600}.nav button.active,.nav button:hover{background:var(--mint);color:var(--green)}.side-foot{position:absolute;bottom:26px;color:#9aa79f;font-size:11px;padding:0 12px}
    main{margin-left:245px;width:calc(100% - 245px);padding:34px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.08em}.top h1{font-size:29px;margin:7px 0 0;letter-spacing:-.05em}.date{color:var(--muted);font-size:13px}.primary{background:var(--green);color:#fff;border-radius:12px;padding:13px 18px;font-weight:700;box-shadow:0 6px 14px #2f8d6330}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.card small{color:var(--muted);font-weight:600}.metric{font-size:30px;font-weight:800;margin-top:8px}.metric.green{color:var(--green)}.metric.orange{color:#e7834b}.layout{display:grid;grid-template-columns:1.4fr .9fr;gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:23px;box-shadow:var(--shadow)}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.panel h2{font-size:17px;margin:0;letter-spacing:-.04em}.sub{color:var(--muted);font-size:12px}.filters{display:flex;gap:8px;margin-bottom:14px}.filters input,.filters select{background:#f7f9f7;border:1px solid var(--line);padding:10px 12px;border-radius:10px;outline:none}.filters input{flex:1}.lead{display:grid;grid-template-columns:1.2fr .8fr .9fr .8fr auto;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:13px}.lead:last-child{border:0}.lead strong{font-size:14px}.lead small{display:block;color:var(--muted);margin-top:3px}.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700;background:#edf2ee;color:#64736a;white-space:nowrap}.badge.new{background:#e7f3ff;color:#3f82b8}.badge.wait{background:#fff4df;color:#ba7b24}.badge.done{background:#e6f7ee;color:#2c8b5d}.row-btn{background:#f1f6f2;color:var(--green);padding:8px 10px;border-radius:9px;font-size:11px;font-weight:700}.agenda{display:grid;gap:10px}.agenda-item{display:flex;align-items:center;gap:12px;padding:13px;background:#fbfcfb;border-radius:12px}.agenda-date{width:42px;height:42px;border-radius:12px;background:var(--mint);display:grid;place-items:center;color:var(--green);font-weight:800;font-size:12px}.agenda-item strong{font-size:13px}.agenda-item small{display:block;color:var(--muted);margin-top:2px}.template{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.template:last-child{border:0}.template p{margin:0;font-size:13px;line-height:1.5}.copy{background:#fff3eb;color:#d57b43;padding:7px 10px;border-radius:9px;font-size:11px;font-weight:700;white-space:nowrap}.empty{padding:30px;color:var(--muted);text-align:center;font-size:13px}
    .modal-back{position:fixed;inset:0;background:#22382d66;display:none;align-items:center;justify-content:center;padding:20px}.modal-back.show{display:flex}.modal{background:#fff;border-radius:20px;width:min(560px,100%);padding:26px;box-shadow:0 25px 70px #13251c33}.modal h2{margin:0 0 20px;letter-spacing:-.04em}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:0}.field textarea{min-height:80px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.ghost{background:#f1f4f1;color:#64736a;border-radius:10px;padding:11px 16px;font-weight:700}
    @media(max-width:950px){.side{width:190px}.side-foot{display:none}main{margin-left:190px;width:calc(100% - 190px);padding:25px}.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.lead{grid-template-columns:1.4fr 1fr 1fr auto}.lead .reason{display:none}}
    @media(max-width:650px){.side{position:static;width:100%;height:auto;border:0;padding:14px}.app{display:block}.brand{padding:4px 6px 13px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px 11px}.side-foot{display:none}main{margin:0;width:100%;padding:18px}.top{align-items:flex-start}.top h1{font-size:23px}.date{display:none}.primary{padding:10px 12px;font-size:12px}.cards{gap:9px;margin-bottom:18px}.card{padding:14px;border-radius:14px}.metric{font-size:23px}.panel{padding:16px;border-radius:14px}.lead{grid-template-columns:1.2fr 1fr auto}.lead .datecol,.lead .reason{display:none}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand"><strong>더상큼하루</strong><span>창업 클래스 CRM</span></div><nav class="nav"><button class="active">대시보드</button><button>문의·상담 관리</button><button>수업 일정</button><button>답변 템플릿</button><button>커리큘럼</button></nav><div class="side-foot">혼자 운영해도 놓치지 않도록</div></aside>
  <main><header class="top"><div><div class="eyebrow">TODAY'S WORKSPACE</div><h1>안녕하세요, 선생님 👋</h1></div><div style="display:flex;align-items:center;gap:18px"><span class="date" id="today"></span><button class="primary" id="addBtn">+ 새 문의 등록</button></div></header>
    <section class="cards"><div class="card"><small>전체 문의</small><div class="metric" id="totalMetric">0</div></div><div class="card"><small>답변 대기</small><div class="metric orange" id="waitingMetric">0</div></div><div class="card"><small>입금 완료</small><div class="metric green" id="paidMetric">0</div></div><div class="card"><small>이번 달 수업</small><div class="metric green" id="classMetric">0</div></div></section>
    <div class="layout"><section class="panel"><div class="panel-head"><div><h2>최근 문의·상담</h2><div class="sub">상담 단계별로 다음 할 일을 확인하세요</div></div></div><div class="filters"><input id="search" placeholder="이름, 연락처, 상담 메모 검색"><select id="statusFilter"><option value="all">전체 단계</option><option>신규 문의</option><option>커리큘럼 안내</option><option>고민·질문 응답</option><option>입금 대기</option><option>입금 완료</option><option>수업 완료</option></select></div><div id="leadList"></div></section>
      <div style="display:grid;gap:20px"><section class="panel"><div class="panel-head"><div><h2>다가오는 수업</h2><div class="sub">수업 전 준비사항을 미리 챙기세요</div></div></div><div class="agenda" id="agenda"></div></section><section class="panel"><div class="panel-head"><div><h2>빠른 답변 템플릿</h2><div class="sub">버튼을 눌러 메시지를 복사하세요</div></div></div><div id="templates"></div></section></div>
    </div>
  </main>
</div>
<div class="modal-back" id="modalBack"><div class="modal"><h2>새 문의 등록</h2><form id="leadForm"><div class="form"><div class="field"><label>이름 *</label><input name="name" required placeholder="예: 김민지"></div><div class="field"><label>연락처</label><input name="phone" placeholder="010-0000-0000"></div><div class="field"><label>상담 단계</label><select name="status"><option>신규 문의</option><option>커리큘럼 안내</option><option>고민·질문 응답</option><option>입금 대기</option><option>입금 완료</option><option>수업 완료</option></select></div><div class="field"><label>수업 예정일</label><input type="date" name="classDate"></div><div class="field full"><label>이 수업을 들으려는 이유</label><textarea name="reason" placeholder="창업 시기, 현재 고민 등을 기록해 주세요"></textarea></div><div class="field full"><label>상담 메모</label><textarea name="memo" placeholder="다음에 안내할 내용을 적어 주세요"></textarea></div></div><div class="modal-actions"><button type="button" class="ghost" id="cancelBtn">취소</button><button class="primary">저장하기</button></div></form></div></div>
<script>
const defaultLeads=[{id:1,name:'이서연',phone:'010-****-1234',status:'입금 완료',classDate:'2026-08-17',reason:'카페 샌드위치 메뉴를 추가하고 싶어요',memo:'입금 확인, 수업 전 준비사항 안내 예정'},{id:2,name:'박지은',phone:'010-****-5678',status:'고민·질문 응답',classDate:'',reason:'내년에 작은 매장을 열고 싶어요',memo:'원가와 가격 책정이 고민이라고 함'},{id:3,name:'최은정',phone:'010-****-9012',status:'신규 문의',classDate:'',reason:'도시락 단체주문을 시작하고 싶어요',memo:'첫 답변 및 수강 목적 질문 필요'}];
let leads=JSON.parse(localStorage.getItem('sandwichLeads')||'null')||defaultLeads;
const templates=[['첫 문의 답변','안녕하세요, 더상큼하루 창업 클래스입니다 😊 먼저 이 수업을 들으려고 하시는 이유와 현재 준비하고 계신 상황을 알려주실 수 있을까요?'],['커리큘럼 안내','단 1회 5시간 동안 메뉴 제조·포장·마케팅·원가 계산까지 실전으로 진행합니다. 햄치즈, 애플에그, 포테이토에그, 크랜베리 닭가슴살, 카야 토스트를 직접 만들고 포장까지 연습해요.'],['입금 안내','수강료는 수업료 93만원 + 재료비 5만원으로 총 98만원입니다. 입금 확인 후 원하시는 날짜로 예약을 도와드립니다.'],['입금 후 수업 안내','입금 확인되었습니다 😊 수업은 오전 10시에 더상큼하루 매장에서 진행됩니다. 수업 중 만든 샌드위치는 모두 포장해 가실 수 있어요.']];
const $=s=>document.querySelector(s); function save(){localStorage.setItem('sandwichLeads',JSON.stringify(leads))} function badgeClass(s){return s==='신규 문의'?'new':s==='입금 대기'?'wait':s==='입금 완료'||s==='수업 완료'?'done':''}
function render(){const q=$('#search').value.toLowerCase(), f=$('#statusFilter').value; const filtered=leads.filter(x=>(f==='all'||x.status===f)&&[x.name,x.phone,x.reason,x.memo].join(' ').toLowerCase().includes(q)); $('#totalMetric').textContent=leads.length;$('#waitingMetric').textContent=leads.filter(x=>!['입금 완료','수업 완료'].includes(x.status)).length;$('#paidMetric').textContent=leads.filter(x=>x.status==='입금 완료').length;$('#classMetric').textContent=leads.filter(x=>x.classDate&&x.classDate.slice(0,7)==='2026-08').length; $('#leadList').innerHTML=filtered.length?filtered.map(x=>`<div class="lead"><div><strong>${x.name}</strong><small>${x.phone||'연락처 미입력'}</small></div><div class="reason"><small>${x.reason||'상담 목적 미기록'}</small></div><div class="datecol"><small>${x.classDate||'일정 미정'}</small></div><span class="badge ${badgeClass(x.status)}">${x.status}</span><button class="row-btn" onclick="advance(${x.id})">다음 단계</button></div>`).join(''):'<div class="empty">조건에 맞는 문의가 없습니다.</div>'; const upcoming=leads.filter(x=>x.classDate).sort((a,b)=>a.classDate.localeCompare(b.classDate)).slice(0,4); $('#agenda').innerHTML=upcoming.length?upcoming.map(x=>{const d=new Date(x.classDate+'T00:00:00');return `<div class="agenda-item"><div class="agenda-date">${d.getMonth()+1}/${d.getDate()}</div><div><strong>${x.name} 수업</strong><small>오전 10:00 · ${x.status}</small></div></div>`}).join(''):'<div class="empty">예정된 수업이 없습니다.</div>'; $('#templates').innerHTML=templates.map(([t,m])=>`<div class="template"><p><strong>${t}</strong><br><span class="sub">${m.slice(0,42)}…</span></p><button class="copy" onclick="copyText(${JSON.stringify(m)})">복사</button></div>`).join('')}
function advance(id){const order=['신규 문의','커리큘럼 안내','고민·질문 응답','입금 대기','입금 완료','수업 완료'];const x=leads.find(a=>a.id===id);x.status=order[Math.min(order.indexOf(x.status)+1,order.length-1)];save();render()} function copyText(t){navigator.clipboard?.writeText(t);alert('답변 문구를 복사했습니다.')} $('#addBtn').onclick=()=>$('#modalBack').classList.add('show');$('#cancelBtn').onclick=()=>$('#modalBack').classList.remove('show');$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')$('#modalBack').classList.remove('show')};$('#leadForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);leads.unshift({id:Date.now(),name:f.get('name'),phone:f.get('phone'),status:f.get('status'),classDate:f.get('classDate'),reason:f.get('reason'),memo:f.get('memo')});save();e.target.reset();$('#modalBack').classList.remove('show');render()};$('#search').oninput=render;$('#statusFilter').onchange=render;$('#today').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});render();
</script>
</body></html>
