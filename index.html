p:12px}.quote-actions button{border:0;border-radius:11px;padding:12px;background:var(--green);color:#fff;font-weight:800}.quote-actions .light{border:1px solid var(--green);background:#fff;color:var(--green)}.quote-help{margin:10px 0 0;color:var(--muted);font-size:11px;line-height:1.6}.error{color:var(--danger);font-size:12px}.toast{position:fixed;right:20px;bottom:20px;z-index:30;padding:12px 16px;border-radius:12px;background:var(--deep);color:#fff;box-shadow:var(--shadow)}@media(max-width:850px){.sidebar{position:static;width:100%;padding:13px}.brand{padding:4px 7px 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.logout{position:static;width:auto;margin-top:5px}main{margin:0;padding:18px}.top{align-items:flex-start}.top h1{font-size:23px}.metrics{grid-template-columns:1fr 1fr;gap:8px}.filters{width:100%;flex-wrap:wrap}.filters input{min-width:0;flex:1}.panel{padding:15px}.lead{grid-template-columns:1fr .8fr auto}.lead .company,.lead .date{display:none}.details,.form-grid{grid-template-columns:1fr}.detail.full,.field.full{grid-column:auto}.quote-builder{padding:15px}.quote-head{align-items:center}.quote-actions{grid-template-columns:1fr}.quote-total strong{font-size:20px}}

<section id="loginScreen" class="login"><div class="login-card"><div class="eyebrow">THE SSANGKEUMHARU</div><h1>사장님 전용 CRM</h1><p class="muted">허용된 이메일로 로그인 링크를 받아 안전하게 접속합니다.</p><input id="loginEmail" type="email" autocomplete="email" placeholder="이메일 주소"><button id="loginButton" class="primary">로그인 링크 받기</button><p id="loginMessage" class="message"></p></div></section>
<div id="app" class="app hidden"><aside class="sidebar"><div class="brand"><strong>더상큼하루</strong><span>문의·주문 CRM</span></div><nav class="nav"><button class="active" data-filter="all">전체 문의</button><button data-filter="group_order">단체주문</button><button data-filter="class">클래스</button><button data-filter="writer">작가·강연</button></nav><button id="logoutButton" class="logout">로그아웃</button></aside><main><header class="top"><div><div class="eyebrow">TODAY'S WORKSPACE</div><h1>오늘 처리할 문의</h1></div><div class="top-actions"><a class="secondary" href="https://center-pf.kakao.com/" target="_blank" rel="noopener noreferrer">카카오 관리자</a><button id="refreshButton" class="primary">새로고침</button></div></header><section class="metrics"><div class="metric"><small>전체 문의</small><strong id="metricTotal">0</strong></div><div class="metric"><small>신규·답변 대기</small><strong id="metricWaiting">0</strong></div><div class="metric"><small>결제 완료</small><strong id="metricPaid">0</strong></div><div class="metric"><small>다가오는 일정</small><strong id="metricUpcoming">0</strong></div></section><section class="panel"><div class="panel-head"><div><h2>문의 목록</h2><span class="muted" id="lastUpdated"></span></div><div class="filters"><input id="searchInput" placeholder="이름·연락처·문의번호 검색"><select id="statusFilter"><option value="all">전체 단계</option></select></div></div><div id="leadList" class="lead-list"></div></section></main></div>
<div id="detailBack" class="modal-back" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="modal"><div class="modal-head"><div><div class="eyebrow" id="detailType"></div><h2 id="detailTitle">문의 상세</h2></div><button class="close" data-close="detailBack">닫기</button></div><div id="detailContent" class="details"></div><section id="quoteBuilder" class="quote-builder hidden"><div class="quote-head"><div><span>MOBILE QUOTATION</span><h3>단체주문 견적서 자동 작성</h3></div><strong id="quoteRevision" class="quote-revision">새 견적</strong></div><div class="form-grid"><div class="field full"><label for="qItemName">상품·구성명</label><input id="qItemName" maxlength="160"></div><div class="field full"><label for="qMenuSummary">최종 메뉴 구성</label><input id="qMenuSummary" maxlength="500" placeholder="예: 햄치즈 12세트 / 애플에그 10세트"></div><div class="field"><label for="qQuantity">최종 수량</label><input id="qQuantity" type="number" inputmode="numeric" min="1" step="1"></div><div class="field"><label for="qUnitPrice">1세트 단가</label><input id="qUnitPrice" type="number" inputmode="numeric" min="0" step="100"></div><div class="field"><label for="qProductAmount">상품금액</label><input id="qProductAmount" type="text" readonly></div><div class="field"><label for="qDeliveryFee">퀵배송비</label><input id="qDeliveryFee" type="number" inputmode="numeric" min="0" step="1000" value="0"></div><div class="field"><label for="qExtraFee">추가비용</label><input id="qExtraFee" type="number" inputmode="numeric" min="0" step="1000" value="0"></div><div class="field"><label for="qDiscount">할인금액</label><input id="qDiscount" type="number" inputmode="numeric" min="0" step="1000" value="0"></div><div class="field"><label for="qValidUntil">견적 유효기간</label><input id="qValidUntil" type="date"></div><div class="field full"><label for="qMemo">견적 메모</label><textarea id="qMemo" rows="3" maxlength="1000" placeholder="포장 변경, 배송 조건 등 최종 안내"></textarea></div></div><div class="quote-total"><span>최종 결제금액</span><strong id="qTotal">0원</strong></div><div class="quote-actions"><button id="qShare" type="button">저장하고 카카오로 공유</button><button id="qCopy" class="light" type="button">견적 문구 복사</button><button id="qSave" class="light" type="button">견적만 저장</button><button id="qPrint" class="light" type="button">PDF·인쇄용 열기</button></div><p class="quote-help">공유하면 견적 버전이 저장되고 상담 단계가 ‘견적 발송’으로 바뀝니다. 휴대폰 공유 목록에서 카카오톡을 선택하세요.</p></section><div class="modal-actions"><a id="callLink" href="#">전화하기</a><a class="secondary" href="https://center-pf.kakao.com/" target="_blank" rel="noopener noreferrer">카카오 열기</a><select id="detailStatus"></select><button id="saveStatus">단계 저장</button></div><div class="template-list" id="templateList"></div></div></div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
(()=>{const cfg=window.FRESH_DAY_CONFIG;if(!cfg||!window.supabase){document.body.textContent='CRM 설정을 확인해 주세요.';return}const db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const $=id=>document.getElementById(id);let leads=[],templates=[],quotes=[],typeFilter='all',selected=null;const statusMap={group_order:['신규 견적','제작 가능 확인','견적 발송','고객 확정','결제 대기','결제 완료','재료 발주','제작 예정','배송 완료','후기 요청','취소'],class:['신규 신청','상담 필요','일정 확인','일정 확정','결제 대기','결제 완료','수업 예정','수업 완료','후기 요청','취소'],writer:['신규 문의','답변 완료','협의 중','확정','완료','취소']};
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}function fmtMoney(v){return v==null?'-':new Intl.NumberFormat('ko-KR').format(v)+'원'}function labelType(t){return t==='group_order'?'단체주문':t==='class'?'클래스':'작가 문의'}function text(v){return v==null||v===''?'-':String(v)}
function el(tag,cls,content){const n=document.createElement(tag);if(cls)n.className=cls;if(content!=null)n.textContent=content;return n}function detail(label,value,full=false){const box=el('div','detail'+(full?' full':''));box.append(el('small','',label),el('strong','',text(value)));return box}
async function load(){const [lr,tr,qr]=await Promise.all([db.from('inquiries').select('id,inquiry_code,lead_type,status,contact_name,phone,company,email,event_date,requested_time,fulfillment_method,address,package_type,quantity,menu1,menu1_qty,menu2,menu2_qty,drink_change,excluded_ingredients,receipt_type,estimated_subtotal,notes,created_at,updated_at').order('created_at',{ascending:false}).limit(300),db.from('reply_templates').select('id,lead_type,stage,title,body,sort_order').order('sort_order'),db.from('order_quotes').select('id,inquiry_id,revision,item_name,menu_summary,quantity,unit_price,product_amount,delivery_fee,extra_fee,discount_amount,total_amount,valid_until,memo,created_at').order('revision',{ascending:false})]);if(lr.error){toast('문의 목록을 불러오지 못했습니다.');return}leads=lr.data||[];templates=tr.data||[];quotes=qr.error?[]:(qr.data||[]);render();$('lastUpdated').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' 기준'}
function filtered(){const q=$('searchInput').value.trim().toLowerCase(),s=$('statusFilter').value;return leads.filter(x=>(typeFilter==='all'||x.lead_type===typeFilter)&&(s==='all'||x.status===s)&&[x.inquiry_code,x.contact_name,x.phone,x.company].join(' ').toLowerCase().includes(q))}
function render(){const list=$('leadList');list.replaceChildren();const rows=filtered();if(!rows.length){list.append(el('div','empty','조건에 맞는 문의가 없습니다.'))}rows.forEach(x=>{const row=el('div','lead');const who=document.createElement('button');who.append(el('strong','',x.contact_name),el('small','',x.inquiry_code));who.addEventListener('click',()=>openDetail(x));const company=el('div','company');company.append(el('span','badge '+x.lead_type,labelType(x.lead_type)),el('small','',text(x.company)));const date=el('div','date');date.append(el('strong','',text(x.event_date)),el('small','',text(x.requested_time)));row.append(who,company,date,el('span','stage',x.status));const open=document.createElement('button');open.className='secondary';open.textContent='보기';open.addEventListener('click',()=>openDetail(x));row.append(open);list.append(row)});$('metricTotal').textContent=leads.length;$('metricWaiting').textContent=leads.filter(x=>!['결제 완료','재료 발주','제작 예정','배송 완료','수업 예정','수업 완료','후기 요청','완료','취소'].includes(x.status)).length;$('metricPaid').textContent=leads.filter(x=>x.status==='결제 완료').length;const now=new Date().toISOString().slice(0,10);$('metricUpcoming').textContent=leads.filter(x=>x.event_date&&x.event_date>=now&&!['배송 완료','수업 완료','완료','취소'].includes(x.status)).length;refreshStatuses()}
function refreshStatuses(){const current=$('statusFilter').value;const all=[...new Set(leads.filter(x=>typeFilter==='all'||x.lead_type===typeFilter).map(x=>x.status))];$('statusFilter').replaceChildren(new Option('전체 단계','all'),...all.map(s=>new Option(s,s)));$('statusFilter').value=all.includes(current)?current:'all'}
function openDetail(x){selected=x;$('detailType').textContent=labelType(x.lead_type);$('detailTitle').textContent=`${x.contact_name} · ${x.inquiry_code}`;const c=$('detailContent');if(x.lead_type==='group_order'){c.replaceChildren(detail('회사·기관',x.company),detail('연락처',x.phone),detail('이메일',x.email),detail('수령일',x.event_date),detail('희망시간',x.requested_time),detail('구성',x.package_type),detail('수량',x.quantity?x.quantity+'세트':'-'),detail('메뉴 1',x.menu1?`${x.menu1} ${x.menu1_qty}세트`:'-'),detail('메뉴 2',x.menu2?`${x.menu2} ${x.menu2_qty}세트`:'-'),detail('수령 방법',x.fulfillment_method==='delivery'?'퀵 배송':x.fulfillment_method==='pickup'?'매장 픽업':'-'),detail('예상 상품금액',fmtMoney(x.estimated_subtotal)),detail('주소',x.address,true),detail('음료 변경',x.drink_change,true),detail('제외 재료',x.excluded_ingredients,true),detail('추가 요청',x.notes,true))}else if(x.lead_type==='class'){c.replaceChildren(detail('현재 상황',x.company),detail('연락처',x.phone),detail('이메일',x.email),detail('희망 날짜',x.event_date),detail('희망 일정',x.requested_time),detail('수강료',fmtMoney(x.estimated_subtotal)),detail('배우고 싶은 내용·고민',x.notes,true))}else{c.replaceChildren(detail('기관·회사',x.company),detail('연락처',x.phone),detail('이메일',x.email),detail('희망 날짜',x.event_date),detail('제안 내용',x.notes,true))}$('callLink').href='tel:'+x.phone.replace(/[^0-9+]/g,'');const statuses=statusMap[x.lead_type]||statusMap.writer;$('detailStatus').replaceChildren(...statuses.map(s=>new Option(s,s)));$('detailStatus').value=x.status;renderQuoteBuilder(x);renderTemplates(x);$('detailBack').classList.add('show')}
const packageNames={A:'A 구성 · 샌드위치 두 쪽',B:'B 구성 · 샌드위치 반쪽 + 팩음료',C:'C 구성 · 샌드위치 반쪽 + 과일 250ml',custom:'맞춤 단체주문'};
function num(id){return Math.max(0,Math.round(Number($(id).value)||0))}
function latestQuote(inquiryId){return quotes.filter(q=>q.inquiry_id===inquiryId).sort((a,b)=>b.revision-a.revision)[0]||null}
function originalMenus(x){return[x.menu1?`${x.menu1} ${x.menu1_qty}세트`:null,x.menu2?`${x.menu2} ${x.menu2_qty}세트`:null].filter(Boolean).join(' / ')}
function quoteDraft(){const quantity=num('qQuantity'),unitPrice=num('qUnitPrice'),productAmount=quantity*unitPrice,deliveryFee=num('qDeliveryFee'),extraFee=num('qExtraFee'),discountAmount=num('qDiscount'),totalAmount=Math.max(0,productAmount+deliveryFee+extraFee-discountAmount);return{item_name:$('qItemName').value.trim(),menu_summary:$('qMenuSummary').value.trim(),quantity,unit_price:unitPrice,product_amount:productAmount,delivery_fee:deliveryFee,extra_fee:extraFee,discount_amount:discountAmount,total_amount:totalAmount,valid_until:$('qValidUntil').value||null,memo:$('qMemo').value.trim()||null}}
function updateQuoteTotal(){const q=quoteDraft();$('qProductAmount').value=fmtMoney(q.product_amount);$('qTotal').textContent=fmtMoney(q.total_amount)}
function renderQuoteBuilder(x){const box=$('quoteBuilder');if(x.lead_type!=='group_order'){box.classList.add('hidden');return}box.classList.remove('hidden');const q=latestQuote(x.id),quantity=q?.quantity||x.quantity||1,unitPrice=q?.unit_price||(x.quantity?Math.round((x.estimated_subtotal||0)/x.quantity):0);$('qItemName').value=q?.item_name||packageNames[x.package_type]||'맞춤 단체주문';$('qMenuSummary').value=q?.menu_summary||originalMenus(x);$('qQuantity').value=quantity;$('qUnitPrice').value=unitPrice;$('qDeliveryFee').value=q?.delivery_fee||0;$('qExtraFee').value=q?.extra_fee||0;$('qDiscount').value=q?.discount_amount||0;$('qValidUntil').value=q?.valid_until||'';$('qMemo').value=q?.memo||'';$('quoteRevision').textContent=q?`최근 v${q.revision}`:'새 견적';updateQuoteTotal()}
function validateQuote(q){if(!selected||selected.lead_type!=='group_order')return'단체주문 문의를 먼저 선택해 주세요.';if(!q.item_name)return'상품·구성명을 입력해 주세요.';if(!q.menu_summary)return'최종 메뉴 구성을 입력해 주세요.';if(q.quantity<1)return'최종 수량을 확인해 주세요.';if(q.unit_price<1)return'1세트 단가를 확인해 주세요.';return''}
async function persistQuote(){const q=quoteDraft(),error=validateQuote(q);if(error){toast(error);return null}const revision=(latestQuote(selected.id)?.revision||0)+1;const payload={inquiry_id:selected.id,revision,...q};const {data,error:saveError}=await db.from('order_quotes').insert(payload).select('id,inquiry_id,revision,item_name,menu_summary,quantity,unit_price,product_amount,delivery_fee,extra_fee,discount_amount,total_amount,valid_until,memo,created_at').single();if(saveError){toast('견적 저장에 실패했습니다.');return null}quotes.unshift(data);renderQuoteBuilder(selected);toast(`견적 v${revision}을 저장했습니다.`);return data}
function orderMethod(x){return x.fulfillment_method==='delivery'?`퀵 배송${x.address?' · '+x.address:''}`:'매장 픽업'}
function quoteMessage(x,q){return `[더상큼하루 단체주문 견적서 v${q.revision}]\n문의번호: ${x.inquiry_code}\n기관명: ${text(x.company)}\n담당자: ${x.contact_name}\n수령일시: ${text(x.event_date)} ${text(x.requested_time)}\n수령방법: ${orderMethod(x)}\n상품: ${q.item_name}\n수량: ${q.quantity}세트 × ${fmtMoney(q.unit_price)}\n메뉴: ${q.menu_summary}\n\n상품금액: ${fmtMoney(q.product_amount)}\n퀵배송비: ${fmtMoney(q.delivery_fee)}\n추가비용: ${fmtMoney(q.extra_fee)}\n할인금액: -${fmtMoney(q.discount_amount)}\n--------------------\n최종 결제금액: ${fmtMoney(q.total_amount)}${q.valid_until?`\n견적 유효기간: ${q.valid_until}`:''}${q.memo?`\n메모: ${q.memo}`:''}\n\n모든 금액은 부가세 포함입니다. 구성과 일정을 최종 확인한 뒤 전액 결제가 완료되면 주문이 확정됩니다. 재료 발주 후에는 취소와 수량 변경이 어렵습니다.`}
async function copyText(value,success){try{await navigator.clipboard.writeText(value);toast(success);return true}catch{window.prompt('아래 내용을 복사해 주세요.',value);return true}}
async function markQuoteSent(){const {error}=await db.from('inquiries').update({status:'견적 발송'}).eq('id',selected.id);if(error)return;selected.status='견적 발송';const row=leads.find(x=>x.id===selected.id);if(row)row.status='견적 발송';$('detailStatus').value='견적 발송';render()}
async function saveAndShare(){const q=await persistQuote();if(!q)return;const message=quoteMessage(selected,q);let shared=false;if(navigator.share){try{await navigator.share({title:`더상큼하루 ${selected.inquiry_code} 견적서`,text:message});shared=true}catch(e){if(e.name!=='AbortError')shared=await copyText(message,'견적 문구를 복사했습니다.')}}else shared=await copyText(message,'견적 문구를 복사했습니다.');if(shared){await markQuoteSent();toast('견적 발송 단계로 변경했습니다.')}}
async function copyQuote(){const q=await persistQuote();if(!q)return;await copyText(quoteMessage(selected,q),'견적 문구를 복사했습니다.');await markQuoteSent()}
function escapeHtml(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function printQuote(){const q={...quoteDraft(),revision:(latestQuote(selected.id)?.revision||0)+1},error=validateQuote(q);if(error){toast(error);return}const w=window.open('','_blank');if(!w){toast('팝업 허용 후 다시 눌러 주세요.');return}w.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>${escapeHtml(selected.inquiry_code)} 견적서</title><style>body{max-width:760px;margin:40px auto;padding:0 24px;color:#24322c;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}header{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #2f8d63;padding-bottom:20px}h1{margin:0;font-size:30px}header div{text-align:right}section{margin:24px 0}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #dde6df;text-align:left}th{width:28%;color:#66736b}.money td:last-child{text-align:right}.total{font-size:22px;font-weight:800;color:#2f8d63}.notice{padding:16px;background:#f1f7f3;border-radius:12px;white-space:pre-wrap}.print{margin-top:24px;padding:12px 18px;border:0;border-radius:10px;background:#2f8d63;color:#fff;font-weight:700}@media print{.print{display:none}body{margin:0}}</style></head><body><header><h1>단체주문 견적서</h1><div><b>더상큼하루</b><br>010-3060-3711<br>서울 은평구 증산로5길 27-5 1층</div></header><section><table><tr><th>문의번호</th><td>${escapeHtml(selected.inquiry_code)}</td></tr><tr><th>기관·담당자</th><td>${escapeHtml(text(selected.company))} · ${escapeHtml(selected.contact_name)}</td></tr><tr><th>수령일시</th><td>${escapeHtml(text(selected.event_date))} ${escapeHtml(text(selected.requested_time))}</td></tr><tr><th>수령방법</th><td>${escapeHtml(orderMethod(selected))}</td></tr><tr><th>상품</th><td>${escapeHtml(q.item_name)}</td></tr><tr><th>수량·단가</th><td>${q.quantity}세트 × ${fmtMoney(q.unit_price)}</td></tr><tr><th>메뉴</th><td>${escapeHtml(q.menu_summary)}</td></tr></table></section><section><table class="money"><tr><td>상품금액</td><td>${fmtMoney(q.product_amount)}</td></tr><tr><td>퀵배송비</td><td>${fmtMoney(q.delivery_fee)}</td></tr><tr><td>추가비용</td><td>${fmtMoney(q.extra_fee)}</td></tr><tr><td>할인금액</td><td>-${fmtMoney(q.discount_amount)}</td></tr><tr class="total"><td>최종 결제금액</td><td>${fmtMoney(q.total_amount)}</td></tr></table></section><section class="notice">${q.valid_until?`견적 유효기간: ${escapeHtml(q.valid_until)}\n`:''}${q.memo?`${escapeHtml(q.memo)}\n\n`:''}모든 금액은 부가세 포함입니다. 구성과 일정을 최종 확인한 뒤 전액 결제가 완료되면 주문이 확정됩니다. 재료 발주 후에는 취소와 수량 변경이 어렵습니다.</section><button class="print" onclick="window.print()">PDF 저장·인쇄</button></body></html>`);w.document.close()}
function renderTemplates(x){const box=$('templateList');box.replaceChildren();templates.filter(t=>t.lead_type===x.lead_type).forEach(t=>{const card=el('div','template');card.append(el('strong','',t.title),el('p','',t.body));const b=el('button','', '답변 복사');b.addEventListener('click',async()=>{let body=t.body.replaceAll('{{estimated_subtotal}}',fmtMoney(x.estimated_subtotal)).replaceAll('{{contact_name}}',x.contact_name).replaceAll('{{class_date}}',text(x.event_date));await navigator.clipboard.writeText(body);toast('답변을 복사했습니다.')});card.append(b);box.append(card)})}
$('loginButton').addEventListener('click',async()=>{const email=$('loginEmail').value.trim();if(!email){$('loginMessage').textContent='이메일을 입력해 주세요.';return}$('loginButton').disabled=true;const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});$('loginButton').disabled=false;$('loginMessage').textContent=error?'로그인 링크 전송에 실패했습니다.':'이메일로 로그인 링크를 보냈습니다.'});$('logoutButton').addEventListener('click',async()=>{await db.auth.signOut();location.reload()});$('refreshButton').addEventListener('click',load);$('searchInput').addEventListener('input',render);$('statusFilter').addEventListener('change',render);document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');typeFilter=b.dataset.filter;render()}));document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>$(b.dataset.close).classList.remove('show')));$('detailBack').addEventListener('click',e=>{if(e.target===$('detailBack'))$('detailBack').classList.remove('show')});['qQuantity','qUnitPrice','qDeliveryFee','qExtraFee','qDiscount'].forEach(id=>$(id).addEventListener('input',updateQuoteTotal));$('qSave').addEventListener('click',persistQuote);$('qShare').addEventListener('click',saveAndShare);$('qCopy').addEventListener('click',copyQuote);$('qPrint').addEventListener('click',printQuote);$('saveStatus').addEventListener('click',async()=>{if(!selected)return;const status=$('detailStatus').value;const {error}=await db.from('inquiries').update({status}).eq('id',selected.id);if(error){toast('단계 저장에 실패했습니다.');return}selected.status=status;const row=leads.find(x=>x.id===selected.id);if(row)row.status=status;render();toast('상담 단계를 저장했습니다.')});
async function start(){const {data}=await db.auth.getSession();if(!data.session){$('loginScreen').classList.remove('hidden');$('app').classList.add('hidden');return}$('loginScreen').classList.add('hidden');$('app').classList.remove('hidden');await load()}db.auth.onAuthStateChange(()=>setTimeout(start,0));start();})();
</script></body></html>
